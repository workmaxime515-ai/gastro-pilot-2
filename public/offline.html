<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Café Coach</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: #FAF7F2;
      color: #1F1A17;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.95rem;
      color: #7A6E63;
      line-height: 1.5;
    }
    .accent { color: #C8956C; }
  </style>
</head>
<body>
  <div class="icon">☕</div>
  <h1>Du bist offline</h1>
  <p>Die letzten Empfehlungen werden angezeigt, sobald du wieder online bist.</p>
</body>
</html>
